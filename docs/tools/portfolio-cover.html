<!doctype html>
<!-- Source of the levente.net portfolio cover (web/assets/img/projects/android-simulator.png): a 1200 x 720 page rendered at 4/3 device pixels = 1600 x 960. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Roboto;src:url('../../versions/4.4.4/assets/Roboto-Regular.ttf')}
@font-face{font-family:RobotoLight;src:url('../../versions/4.4.4/assets/Roboto-Light.ttf')}
@font-face{font-family:RobotoBold;src:url('../../versions/4.4.4/assets/Roboto-Bold.ttf')}
html,body{margin:0;width:1200px;height:720px;overflow:hidden}
body{background:radial-gradient(ellipse at 74% 52%,#1b5a72 0,#10354a 30%,transparent 62%),radial-gradient(ellipse at 6% 12%,#123041 0,transparent 45%),linear-gradient(135deg,#0b1522,#070b12);color:#edf5f7;font-family:Roboto,Arial,sans-serif;position:relative}
.text{position:absolute;left:64px;top:205px;width:420px}
.brand{display:flex;align-items:center;gap:14px;font:700 15px RobotoBold,Arial;letter-spacing:.22em;color:#d9ebed}
.brand i{width:38px;height:38px;border:2px solid #73cde0;border-radius:50%;display:grid;place-items:center}
.brand i:after{content:'';width:12px;height:12px;border-radius:50%;background:#73cde0;box-shadow:0 0 12px #73cde0}
.brand span{color:#73cde0}
h1{margin:34px 0 14px;font:400 64px/1.02 Roboto,Arial;letter-spacing:-.045em}
h1 strong{display:block;font-weight:400;color:#75d3e3}
.range{font:700 15px RobotoBold,Arial;letter-spacing:.16em;color:#74d0e0}
.phones{position:absolute;right:40px;bottom:70px;display:flex;align-items:flex-end}
.phone{position:relative;flex:none;margin-left:-58px;filter:drop-shadow(0 18px 24px #000c)}
.phone:first-child{margin-left:0}
.phone>img.frame{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.phone>.shot{position:absolute;background:center/cover no-repeat;z-index:2}
.phone>b{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font:700 13px RobotoBold;letter-spacing:.14em;color:#9fd7e2;z-index:3;text-shadow:0 1px 6px #000}
/* #thumb: the portfolio card's small picture. The card crops it with object-fit:cover from the top (object-position
   50% 0), from 2.04:1 on wide screens (the top 588 px stay) to the whole picture on phones, so the same layout sits
   100 px higher: less empty band on top, and the phones' feet still inside the wide crop. */
.thumb .text{top:105px}
.thumb .phones{bottom:170px}
</style></head><body>
<div class="text">
  <div class="brand"><i></i><div>ANDROID <span>TIME MACHINE</span></div></div>
  <h1>Old Androids,<strong>in the browser.</strong></h1>
  <div class="range">ANDROID 2.1 – 7.1</div>
</div>
<div class="phones" id="phones"></div>
<script>
const mm = 2.5;
// [version, frame, SVG width / height, real height in mm, screen insets %, body top and bottom in SVG units, picture]
// The SVGs have a margin round the body (side keys, shadow), so the body, not the whole drawing, is scaled to the real height.
const phones = [
  ['2.3.6', 'device-nexus-s.svg', 349.3 / 675.33, 123.9, [15.89, 15.99, 10.49, 10.49], [5.9, 669.3], 'landing-home.jpg'],
  ['4.0.4', 'device-galaxy-nexus.svg', 368.15 / 721.32, 135.5, [13.15, 11.44, 8.21, 8.67], [5.9, 715.5], 'landing-home.jpg'],
  ['4.3', 'device-nexus-4.svg', 374.77 / 722.2, 133.9, [11.86, 12.68, 6.37, 6.37], [6.8, 711.6], 'landing-home.jpg'],
  ['4.4.4', 'device-nexus-5.svg', 370.57 / 728.24, 137.84, [8.83, 11.53, 5.94, 6.02], [6.2, 722.2], 'landing-home.jpg'],
  ['5.1.1', 'device-nexus-6.svg', 423 / 793.18, 159.26, [8.49, 7.96, 6.01, 5.87], [6.2, 784.7], 'landing-home.jpg']
];
if (location.hash === '#thumb') document.body.classList.add('thumb');
const root = document.getElementById('phones');
phones.forEach(([v, frame, ratio, height, [t, b, l, r], [top, bottom], shot], i) => {
  const svgH = {'device-nexus-s.svg': 675.33, 'device-galaxy-nexus.svg': 721.32, 'device-nexus-4.svg': 722.2, 'device-nexus-5.svg': 728.24, 'device-nexus-6.svg': 793.18}[frame];
  const h = height * mm * svgH / (bottom - top), w = h * ratio, el = document.createElement('div');
  // The bodies, not the drawings, stand on one line.
  el.className = 'phone'; el.style.cssText = `width:${w}px;height:${h}px;margin-bottom:${-(svgH - bottom) / svgH * h}px;z-index:${10 + i}`;
  el.innerHTML = `<div class="shot" style="top:${t}%;bottom:${b}%;left:${l}%;right:${r}%;background-image:url('../../versions/${v}/assets/${shot}')"></div><img class="frame" src="../../versions/${v}/assets/${frame}" alt="">`;
  root.append(el);
});
</script>
</body></html>
