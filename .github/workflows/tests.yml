name: Tests

on:
  push:
  pull_request:

# A newer push to the same branch replaces the run still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The module tests (tests/*.cjs), on every push.
  module:
    name: Module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pixel test dependency
        run: python -m pip install -r .github/requirements-tests.txt
      - name: Module tests
        run: node docs/tools/test-ci.mjs

  # Whether the push can change what the browser sees: a push of only documentation, reports, tools or module tests
  # skips the browser flows.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No earlier commit to compare with: the browser flows run."; echo "browser=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|[^/]*\.md$|tests/[^/]*\.cjs$|tests/lib/|\.github/requirements-tests\.txt$)'; then
            echo "Only documentation, tools or module tests changed: the browser flows are skipped."; echo "browser=false" >> "$GITHUB_OUTPUT"
          else
            echo "browser=true" >> "$GITHUB_OUTPUT"
          fi

  # The browser flows (what `npm run test:browser` runs), split into parallel jobs: one per version and one for the
  # flows that are not per version (tests/browser/ci.mjs).
  browser:
    name: Browser ${{ matrix.job }}
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        job: ['2.1', '2.3.6', '4.0.4', '4.3', '4.4.4', '5.1.1', '6.0.1', '7.1.2', 'shared']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser flows
        run: |
          python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/ > /dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8090 CHROME=google-chrome node tests/browser/ci.mjs '${{ matrix.job }}'
      - name: Screenshots of failed flows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-flows-${{ matrix.job }}
          path: tests/browser/artifacts/
          if-no-files-found: ignore
