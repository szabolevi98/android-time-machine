name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The module tests (tests/*.cjs).
      - run: npm test
      # The eight releases, including Nougat's demo/save/five-language release gate.
      - name: Browser flows
        run: |
          python3 -m http.server 8090 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/ > /dev/null && break; sleep 1; done
          BASE=http://127.0.0.1:8090 CHROME=google-chrome npm run test:browser
      - name: Screenshots of failed flows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-flows
          path: tests/browser/artifacts/
          if-no-files-found: ignore
